schema_version: "1.1"
name: multiturn-reread
description: Second turn after settings.py changed on disk; the first turn already read it whole
execution:
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
  runs: 3
context:
  history_file: turn1.jsonl
  scaffold_script: fixture.sh
graders:
  - name: no-second-whole-read
    type: tool_used
    tool: Read
    input_match: 'settings\.py"\}'
    min: 0
    max: 0
