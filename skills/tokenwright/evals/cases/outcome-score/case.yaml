schema_version: "1.1"
name: outcome-score
description: Find the token sink in a recorded session transcript; tw.py score ranks it in one call
execution:
  max_turns: 12
  timeout_seconds: 400
  allowed_tools: [Bash, Read, Glob, Grep, Skill]
  runs: 3
context:
  scaffold_script: fixture.sh
graders:
  - name: used-score
    type: tool_used
    tool: Bash
    input_match: 'tw\.py[\s\S]*\bscore\b'
    arm: with-only
