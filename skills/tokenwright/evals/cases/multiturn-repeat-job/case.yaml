schema_version: "1.1"
name: multiturn-repeat-job
description: Third request for the same two-command log summary; right answer, cheaply. No script expected (tokenwright-script says a script pays at three or more steps; tune T-20261101-2)
execution:
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Bash, Write, Read, Glob, Grep, Skill]
  runs: 3
context:
  history_file: turn1.jsonl
  scaffold_script: fixture.sh
graders: []
