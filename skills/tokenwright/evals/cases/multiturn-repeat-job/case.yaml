schema_version: "1.1"
name: multiturn-repeat-job
description: Third request for the same two-command log summary; the job should become a script with the date as an argument
execution:
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Bash, Write, Read, Glob, Grep, Skill]
  runs: 3
context:
  history_file: turn1.jsonl
  scaffold_script: fixture.sh
graders:
  - name: wrote-script
    type: tool_used
    tool: Write
    input_match: '\.(?:sh|py)"'
