schema_version: "1.1"
name: ab-regen-changed
description: History-free change-check A/B (gc83186). A script rewrites a 1,500-line settings.py; the agent must report which settings it changed. The with arm can snapshot and diff with tw.py changed; the measure is tokens per arm at equal correctness.
execution:
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Bash, Write, Read, Glob, Grep, Skill]
  runs: 3
context:
  scaffold_script: fixture.sh
graders: []
